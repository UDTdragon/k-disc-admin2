<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="k-DISC 조직관리 관리자 대시보드" />
    <title>k-DISC 조직관리</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="company-select" type="button" aria-label="회사 선택">
          <span class="company-dot" aria-hidden="true"></span>
          <span>네오아이즈</span>
        </button>

        <div class="topbar-actions topbar-actions--primary">
          <span class="code-count">코드 15개 남음</span>
          <button class="button button--primary" type="button" data-toast="검사코드 발송 화면으로 이동합니다.">검사코드 발송</button>
        </div>

        <div class="topbar-actions topbar-actions--account">
          <button class="button button--outline" type="button" data-toast="관리자 정보수정 기능입니다.">관리자 정보수정</button>
          <button class="button button--soft" type="button" data-toast="로그아웃 기능입니다.">로그아웃</button>
        </div>
      </header>

      <aside class="sidebar" aria-label="주요 메뉴">
        <nav class="side-nav">
          <button class="side-nav__item is-active" type="button" data-page="홈">
            <span class="side-nav__dot" aria-hidden="true"></span>
            <span>홈</span>
          </button>
          <button class="side-nav__item" type="button" data-page="검사">
            <span class="side-nav__dot" aria-hidden="true"></span>
            <span>검사</span>
          </button>
          <button class="side-nav__item" type="button" data-page="그룹">
            <span class="side-nav__dot" aria-hidden="true"></span>
            <span>그룹</span>
          </button>
          <button class="side-nav__item" type="button" data-page="리포트">
            <span class="side-nav__dot" aria-hidden="true"></span>
            <span>리포트</span>
          </button>
        </nav>
      </aside>

      <main class="main-content">
        <section class="page-heading">
          <h1>k-DISC 조직관리</h1>
          <p>조직의 검사 현황과 자주 사용하는 관리 기능을 한눈에 확인하세요.</p>
        </section>

        <section class="stats-grid" aria-label="검사 현황">
          <article class="stat-card">
            <div class="stat-card__copy">
              <h2>전체 검사자</h2>
              <p class="stat-card__value"><strong>50</strong><span>명</span></p>
              <p class="stat-card__detail">지난주 대비 10명 증가</p>
            </div>
            <div class="stat-card__icon stat-card__icon--blue">
              <img src="assets/53-2.svg" alt="전체 검사자" />
            </div>
          </article>

          <article class="stat-card">
            <div class="stat-card__copy">
              <h2>검사완료</h2>
              <p class="stat-card__value"><strong>20</strong><span>명</span></p>
              <p class="stat-card__detail">완료율 40%</p>
            </div>
            <div class="stat-card__icon stat-card__icon--green">
              <img src="assets/53-6.svg" alt="검사완료" />
            </div>
          </article>

          <article class="stat-card">
            <div class="stat-card__copy">
              <h2>검사중</h2>
              <p class="stat-card__value"><strong>5</strong><span>명</span></p>
              <p class="stat-card__detail">평균 소요 8분</p>
            </div>
            <div class="stat-card__icon stat-card__icon--orange">
              <img src="assets/53-9.svg" alt="검사중" />
            </div>
          </article>

          <article class="stat-card">
            <div class="stat-card__copy">
              <h2>발송완료</h2>
              <p class="stat-card__value"><strong>25</strong><span>명</span></p>
              <p class="stat-card__detail">최근 발송 : 2026. 08. 06</p>
            </div>
            <div class="stat-card__icon stat-card__icon--purple">
              <img src="assets/53-12.svg" alt="발송완료" />
            </div>
          </article>
        </section>

        <section class="dashboard-grid">
          <article class="panel quick-panel">
            <div class="panel-heading">
              <h2>빠른 작업</h2>
              <p>자주 쓰는 기능을 먼저 보여드립니다.</p>
            </div>

            <div class="quick-list">
              <button class="quick-action quick-action--selected" type="button" data-toast="검사코드 발송 화면으로 이동합니다.">
                <span class="quick-action__icon"><img src="assets/53-16.svg" alt="" /></span>
                <span class="quick-action__copy"><strong>검사코드 발송</strong><small>카카오톡 or 이메일 발송</small></span>
                <span class="quick-action__arrow" aria-hidden="true">→</span>
              </button>
              <button class="quick-action" type="button" data-toast="그룹 추가 화면으로 이동합니다.">
                <span class="quick-action__icon"><img src="assets/53-19.svg" alt="" /></span>
                <span class="quick-action__copy"><strong>그룹 추가</strong><small>1차 or 2차 그룹 추가</small></span>
                <span class="quick-action__arrow" aria-hidden="true">→</span>
              </button>
              <button class="quick-action" type="button" data-toast="조직 리포트 화면으로 이동합니다.">
                <span class="quick-action__icon"><img src="assets/53-23.svg" alt="" /></span>
                <span class="quick-action__copy"><strong>조직 리포트 보기</strong><small>완료 기준 인원 전체 or 선택 인원</small></span>
                <span class="quick-action__arrow" aria-hidden="true">→</span>
              </button>
            </div>
          </article>

          <article class="panel examinee-panel">
            <div class="panel-heading panel-heading--with-action">
              <div>
                <h2>검사자 관리</h2>
                <p>최근 완료된 검사자의 결과를 빠르게 확인할 수 있습니다.</p>
              </div>
              <button class="circle-button" type="button" aria-label="검사자 추가" data-add-row>+</button>
            </div>

            <div class="table-grid">
              <section class="mini-table" aria-labelledby="completed-title">
                <h3 id="completed-title">최근 완료자</h3>
                <div class="table-head"><span>사용자</span><span>그룹</span><span>검사 완료일</span><span>리포트</span></div>
                <div class="table-body" id="completed-list"></div>
              </section>

              <section class="mini-table" aria-labelledby="progress-title">
                <h3 id="progress-title">검사중 인원</h3>
                <div class="table-head"><span>사용자</span><span>그룹</span><span>검사 완료일</span><span>리포트</span></div>
                <div class="table-body" id="progress-list"></div>
              </section>
            </div>
          </article>
        </section>
      </main>
    </div>

    <div class="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
